name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners already include the Android SDK, so the old
      # android-actions/setup-android step (which fails on the removed 'tools' package) is not needed.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Installs Gradle 8.9 itself, so the build does not depend on gradle/wrapper/gradle-wrapper.jar
      # (which is easy to lose when uploading files through the GitHub website).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXTapeLoader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
